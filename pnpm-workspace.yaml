# pnpm 11 settings file AND, since plan 01-02 (2026-08-20), the workspace
# definition. It carried no `packages:` key through all of Phase 0 because that
# phase was deliberately single-package (see 00-01-PLAN.md task 1); Phase 1's
# DET-03 needs `packages/engine` to be a real package with its own manifest —
# a path alias is a convention, a separate package.json plus knip is a boundary.
#
# `packages` and `allowBuilds` are INDEPENDENT controls. Adding the first must
# not disturb the second, and tests/pins.spec.ts asserts both survive every
# install.
packages:
  - packages/*

# DIST-06's two dependency traps, disarmed BEFORE anything can install a bad
# transitive version. Neither package is installed today — the pins exist so a
# Phase 5 frontend cannot resolve a version that breaks its consumer:
#   primevue     — @caido/primevue peer-depends on EXACTLY 4.1.0
#   tailwindcss  — @caido/tailwindcss hard-depends on 3.4.13 and uses a v3 API
#                  that v4 removed
#
# These live HERE and not under a `pnpm.overrides` key in package.json:
# pnpm 11 NO LONGER READS package.json's `pnpm` field and ignores it with a
# warning (measured this session — the install printed
# `The "pnpm" field in package.json is no longer read by pnpm. The following
# keys were ignored: "pnpm.overrides"`). A pin in the old location is not a
# weaker pin, it is NO pin, which is worse than none because it reads as
# protection. tests/pins.spec.ts asserts them here and in the lockfile.
overrides:
  primevue: 4.1.0
  tailwindcss: 3.4.13
  # Build-only transitives pinned at the first versions that close the 2026-08-27
  # pnpm-audit set. Their parents either fix an older range or are already at
  # their latest release, so a root override is the only effective control.
  cookie@<0.7.0: 0.7.2
  esbuild@<=0.24.2: 0.25.12
  glob@>=11.0.0 <11.1.0: 11.1.0
  qs@<6.15.2: 6.15.3
  sharp@<0.35.0: 0.35.0
  vite@<=6.4.2: 6.4.3
  ws@<8.21.0: 8.21.0

# Dependency build scripts are allowlisted EXPLICITLY rather than blanket-approved,
# because Phase 0 gated its install set through a package-legitimacy checkpoint
# (00-01 task 0). Every entry below is a deliberate true/false decision.
allowBuilds:
  # true — required by vite/vitest (the test framework this phase's gates run on)
  # and by tsup inside @caido-community/dev. Its install script fetches only the
  # matching @esbuild/<platform> binary already pinned in pnpm-lock.yaml.
  esbuild: true

  # false — transitive via @caido-community/dev, used for plugin ICON processing
  # only. Tier-0 probes never build icons. Declined explicitly, not silently
  # ignored. If a Tier-1 build in plan 00-04 needs it, that plan revisits this.
  sharp: false
