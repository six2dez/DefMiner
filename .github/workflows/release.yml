name: 🚀 Release

# MANUAL, NOT ON PUSH. A release mints a tag and publishes a signed artifact to
# the Caido store's update path; that should be a decision, not a side effect of
# merging.
on:
  workflow_dispatch:

env:
  # 26, matching ci.yml — see the note there. This job does not run the suite,
  # so 20 built fine; keeping the two workflows on one runtime means the thing
  # that gets tested is the thing that gets shipped.
  NODE_VERSION: 26
  # 11 — see the note in ci.yml. This matters more here than there: under
  # pnpm 9 this workflow built the SHIPPED artifact from an unlocked tree with
  # the DIST-06 pins inert.
  PNPM_VERSION: 11

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # A CEILING, BECAUSE THIS JOB ALREADY BURNED SIX HOURS ONCE. The first
    # release attempt wedged inside the test suite and was killed by the Actions
    # 6h maximum, having produced no output after vitest's banner. Whatever the
    # cause, the failure mode "hangs silently until the platform limit" must not
    # be reachable: 20 minutes is roughly 10x the honest cost of this job.
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: true

      # TYPECHECK AND LINT ONLY, AND THE SUITE DELIBERATELY NOT.
      #
      # The first release attempt ran the full suite here and hung: vitest
      # printed its banner at 23:13:00 and emitted nothing for six hours. The
      # cause is known now, and it was never this workflow's shape: the job ran
      # NODE 20, where `jsdom@30`'s `undici@8` calls a `markAsUncloneable` that
      # does not exist, every jsdom worker fails to start, and the vitest pool
      # goes quiet instead of reporting it. NODE_VERSION is 26 above and the
      # suite is green.
      #
      # It still does not belong on the release path. The upstream
      # starterkit's release workflow runs no tests at all; ci.yml runs the
      # suite on every push, where a hang is a nuisance rather than the thing
      # standing between a finished plugin and its users. What stays here are
      # the two gates that are deterministic, fast, and actually able to
      # invalidate a build artifact.
      - name: Check
        run: |
          pnpm typecheck
          pnpm lint

      # Writes packages/dist/plugin_package.zip AND
      # packages/dist/plugin_package/manifest.json.
      #
      # NOT `dist/` AT THE REPOSITORY ROOT. That directory belongs to the Phase 0
      # measurement probes (parse-probe, redos-probe, mapbytes-probe) and holds a
      # completely different, installable zip. A path typo here would publish the
      # probes to the store under DefMiner's name, so the step below verifies the
      # manifest it is about to release actually says "defminer".
      - name: Build package
        run: pnpm build

      # THE VERSION COMES FROM THE BUILT MANIFEST, not from a file somebody might
      # forget to keep in step with it. `packages/caido.config.ts` is TypeScript
      # and cannot be read with jq; the generated manifest is the value that
      # actually ships, so reading it here means the git tag and the artifact can
      # never disagree.
      - name: Read version from the built manifest
        id: meta
        run: |
          MANIFEST=packages/dist/plugin_package/manifest.json
          test -f "$MANIFEST" || { echo "::error::$MANIFEST missing — did pnpm build write to packages/dist?"; exit 1; }

          ID=$(jq -r .id "$MANIFEST")
          if [ "$ID" != "defminer" ]; then
            echo "::error::manifest id is '$ID', expected 'defminer' — this is the wrong package"
            exit 1
          fi

          # The frontend must be wired to the backend. `backend` is OPTIONAL in
          # the builder's schema, so omitting it is valid and silently produces
          # "backend": null — a plugin whose every RPC times out with no error
          # anywhere. That shipped once; it does not ship again.
          LINK=$(jq -r '.plugins[] | select(.kind=="frontend") | .backend.id // "null"' "$MANIFEST")
          if [ "$LINK" != "defminer-backend" ]; then
            echo "::error::frontend plugin is not linked to a backend (backend.id = '$LINK')"
            exit 1
          fi

          VERSION=$(jq -r .version "$MANIFEST")
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$VERSION' is not three-part semver"; exit 1 ;;
          esac

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists — bump version in packages/caido.config.ts"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing DefMiner ${VERSION}"

      # Ed25519 over the raw zip bytes. The store verifies this signature against
      # the public_key in caido/store's plugin_packages.json, so the key that
      # signs here must be the one whose public half was submitted.
      - name: Sign package
        working-directory: packages/dist
        run: |
          if [[ -z "${{ secrets.PRIVATE_KEY }}" ]]; then
            echo "::error::PRIVATE_KEY secret is not set — the store will reject an unsigned package"
            exit 1
          fi
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
          openssl pkeyutl -sign -inkey private_key.pem -out plugin_package.zip.sig -rawin -in plugin_package.zip
          rm private_key.pem
          test -s plugin_package.zip.sig || { echo "::error::signature is empty"; exit 1; }

      # A DRAFT FIRST, BECAUSE THIS REPOSITORY HAS IMMUTABLE RELEASES ON.
      #
      # Caido's store requires the setting (Settings → General → Releases →
      # Immutable releases), and a PUBLISHED immutable release accepts no asset
      # uploads afterwards. This action creates the release and only then
      # uploads, so with immutability on it failed both uploads with "Cannot
      # upload assets to an immutable release" and left 0.1.0 published, frozen
      # and EMPTY — a release the store cannot install anything from, while the
      # job itself reported success.
      #
      # Drafts stay mutable. The zip and its signature are attached here, and
      # the release is published in the next step, once it is complete.
      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.version }}
          commit: ${{ github.sha }}
          body: 'Release ${{ steps.meta.outputs.version }}'
          draft: true
          artifacts: 'packages/dist/plugin_package.zip,packages/dist/plugin_package.zip.sig'

      # PUBLISHING IS WHAT FREEZES IT, so nothing may be missing by this point.
      # The asset count is checked after publishing because a green job with an
      # empty release is precisely the failure that got here once already.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest

          COUNT=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::published release has $COUNT assets, expected plugin_package.zip and plugin_package.zip.sig"
            exit 1
          fi
          echo "Published $TAG with $COUNT assets"
