name: CI

# THE SUITE LIVES HERE, NOT ON THE RELEASE PATH. A hang in a test is a nuisance
# to a push; on the release workflow it was the thing standing between a
# finished plugin and its users.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # NODE 26, NOT 20 — 20 COST THIS REPOSITORY EVERY CI RUN IT EVER MADE.
  #
  # `jsdom@30` imports `undici@8`, which calls `webidl.util.markAsUncloneable`,
  # a Node API that does not exist in 20. The forks worker for every jsdom spec
  # then fails to start, and with 24 of them the vitest pool stops making
  # progress instead of reporting the error: thirteen minutes of total silence
  # and then the timeout. Both CI runs on record died there, on the same 24
  # files — the frontend suite has never once executed on this runner.
  # Reproduced exactly on Node 20 locally; green on 24 and 26.
  #
  # 26 and not 24, because `packages/backend/src/store/sources.spec.ts` asserts
  # that a NUL byte round-trips byte-identically, and the SQLite bundled with
  # Node 24's `node:sqlite` does not honour it. That driver is the TEST FIXTURE
  # only — the shipped backend uses Caido's database — but a red suite is a red
  # suite.
  NODE_VERSION: 26
  PNPM_VERSION: 9

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The suite is ~21 s. The wedge that made this ceiling necessary is
    # understood and fixed (see NODE_VERSION), but the ceiling stays: a hang
    # that reports nothing is exactly the failure worth bounding.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: true

      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint

      # `corpus/` is gitignored, so a fresh checkout has none of the vendor
      # bundles the map fixtures read. Without this the suite fails 11 tests
      # for a missing 40 MB of downloads rather than for anything real.
      - name: Fetch the vendor corpus
        run: bash scripts/phase7/fetch-maps.sh

      # THE DEFAULT REPORTER, NOT `dot`. `dot` buffers on a non-TTY, which is
      # why the six-hour release hang produced no clue about WHERE it stopped.
      # Per-file progress costs nothing and makes the next hang diagnosable.
      #
      # `**/frontend-load.spec.ts` is excluded by glob rather than by relative
      # path: it is a frame budget that fails on a loaded shared runner while
      # passing 12/12 in isolation. It was also the long-standing suspect for
      # the hang — the only spec that spawns a nested package manager from
      # inside a vitest worker — and it was NOT the cause; Node 20 was. It stays
      # excluded for the frame-budget reason alone, and loudly, so nobody reads
      # a green CI run as evidence the budget held.
      - name: Test
        run: pnpm vitest run --exclude '**/frontend-load.spec.ts'

      - name: Build
        run: pnpm build
